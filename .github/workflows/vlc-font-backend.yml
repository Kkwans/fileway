name: VLC Android font backend trial
on:
  workflow_dispatch:
    inputs:
      abi:
        description: Native test ABI
        type: choice
        options: [x86_64, arm64-v8a]
        default: x86_64
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify source preparation guards
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_vlc_font_backend.py'
          bash -n scripts/build-vlc-font-backend.sh
      - name: Source build dependencies (ephemeral runner)
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends autoconf automake autopoint bison flex gettext libtool libtool-bin pkg-config cmake meson ninja-build nasm yasm gperf ragel curl xz-utils
      - name: Install pinned NDK
        run: |
          export ANDROID_HOME="$RUNNER_TEMP/nfb-vlc-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl --fail --location --retry 2 'https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip' -o "$RUNNER_TEMP/vlc-sdk-tools.zip"
          echo 'e025545c62a8e64c7559119566a569fb1dec5f60  '"$RUNNER_TEMP/vlc-sdk-tools.zip" | sha1sum --check
          unzip -q "$RUNNER_TEMP/vlc-sdk-tools.zip" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          SDK_STATUS="${PIPESTATUS[1]}"
          set -o pipefail
          test "$SDK_STATUS" = 0
          "$SDKMANAGER" 'ndk;28.2.13676358'
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Build locked libVLC with Android text and ASS font discovery
        env:
          NFB_VLC_ABI: ${{ inputs.abi }}
        run: bash scripts/build-vlc-font-backend.sh "$NFB_VLC_ABI" "$RUNNER_TEMP/nfb-vlc-build" "$RUNNER_TEMP/nfb-vlc-source-archives"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: vlc-font-backend-trial-${{ inputs.abi }}
          path: |
            ${{ runner.temp }}/nfb-vlc-build/artifact/
            ${{ runner.temp }}/nfb-vlc-build/source-provenance.json
            ${{ runner.temp }}/nfb-vlc-build/subtitle-cache-*.c
            ${{ runner.temp }}/nfb-vlc-build/subtitle-cache-original-result.txt
            ${{ runner.temp }}/nfb-vlc-build/subtitle-seek-*.cpp
            ${{ runner.temp }}/nfb-vlc-build/subtitle-seek-original-result.txt
            ${{ runner.temp }}/nfb-vlc-source-archives/
            native/patches/libvlc-3.7.6-android-fonts.patch
            native/patches/libass-0.17.5-android-provider.patch
            native/patches/libvlc-3.7.6-subtitle-cache.patch
            native/patches/libvlc-3.7.6-subtitle-group-seek.patch
            native/ass_android_font_provider.h
            native/vlc-font-backend.lock.json
