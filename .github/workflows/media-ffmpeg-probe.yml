name: Media3 FFmpeg comparison library
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: clients/android
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify build input and ELF validation contracts
        run: |
          export NFB_CHECK_TMP="$RUNNER_TEMP/fileway-probe-tests"
          mkdir -p "$NFB_CHECK_TMP"
          python3 -m unittest discover -s scripts/tests -p test_ffmpeg_probe.py -v
      - name: Provision isolated Android build inputs
        run: |
          export ANDROID_HOME="$RUNNER_TEMP/fileway-media-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_USER_HOME="$RUNNER_TEMP/fileway-media-android-user"
          export TMPDIR="$RUNNER_TEMP/fileway-media-tmp"
          mkdir -p "$ANDROID_USER_HOME" "$TMPDIR"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl --fail --location --retry 2 'https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip' -o "$RUNNER_TEMP/media-sdk-tools.zip"
          echo 'e025545c62a8e64c7559119566a569fb1dec5f60  '"$RUNNER_TEMP/media-sdk-tools.zip" | sha1sum --check
          unzip -q "$RUNNER_TEMP/media-sdk-tools.zip" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          SDK_STATUS="${PIPESTATUS[1]}"
          set -o pipefail
          test "$SDK_STATUS" = 0
          "$SDKMANAGER" 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_USER_HOME=$ANDROID_USER_HOME" >> "$GITHUB_ENV"
          echo "TMPDIR=$TMPDIR" >> "$GITHUB_ENV"
          echo "GRADLE_USER_HOME=$RUNNER_TEMP/fileway-media-gradle" >> "$GITHUB_ENV"
          echo "FILEWAY_PROBE_WORK=$RUNNER_TEMP/fileway-ffmpeg-probe" >> "$GITHUB_ENV"
          echo "FILEWAY_PROBE_OUTPUT=$RUNNER_TEMP/fileway-ffmpeg-artifacts" >> "$GITHUB_ENV"
      - name: Build pinned audio decoders for both ABIs
        run: |
          python3 scripts/prepare-ffmpeg-probe.py --work-root "$FILEWAY_PROBE_WORK" --ndk "$ANDROID_HOME/ndk/28.2.13676358" --jobs 4
          ./gradlew :ffmpeg-probe:assembleRelease :ffmpeg-probe:lintRelease -PfilewayFfmpegWorkDir="$FILEWAY_PROBE_WORK" --stacktrace
      - name: Verify native alignment, symbol isolation and source bundle
        run: |
          python3 scripts/package-ffmpeg-probe.py --work-root "$FILEWAY_PROBE_WORK" --ndk "$ANDROID_HOME/ndk/28.2.13676358" --aar ffmpeg-probe/build/outputs/aar/ffmpeg-probe-release.aar --output-dir "$FILEWAY_PROBE_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: media3-ffmpeg-probe-${{ github.sha }}
          path: ${{ runner.temp }}/fileway-ffmpeg-artifacts/
          if-no-files-found: error
