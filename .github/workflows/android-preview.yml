name: Android preview package
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  media-native:
    uses: ./.github/workflows/media-ffmpeg-probe.yml
  package:
    needs: media-native
    env:
      ORG_GRADLE_PROJECT_filewayFfmpegManifest: ${{ github.workspace }}/media-native/ffmpeg-probe.json
    defaults:
      run:
        working-directory: clients/android
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: media3-ffmpeg-probe-${{ github.sha }}
          path: media-native
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.6'
          cache: false
      - name: Install Android SDK
        run: |
          export ANDROID_HOME="$RUNNER_TEMP/nfb-android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl --fail --location --retry 2 'https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip' -o "$RUNNER_TEMP/sdk-tools.zip"
          echo 'e025545c62a8e64c7559119566a569fb1dec5f60  '"$RUNNER_TEMP/sdk-tools.zip" | sha1sum --check
          unzip -q "$RUNNER_TEMP/sdk-tools.zip" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          SDK_STATUS="${PIPESTATUS[1]}"
          set -o pipefail
          test "$SDK_STATUS" = 0
          "$SDKMANAGER" 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
          test -d "$ANDROID_HOME/ndk/28.2.13676358"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Check playback cache control boundary
        working-directory: clients/shared/core
        run: |
          go test -race ./transport
          go vet ./transport ./bridge
      - name: Build native transport
        run: bash scripts/build-native.sh
      - name: Build preview APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Record exact source and checksum
        run: |
          git rev-parse HEAD > app/build/outputs/apk/debug/SOURCE_SHA.txt
          cd app/build/outputs/apk/debug
          sha256sum app-debug.apk > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-preview-package
          path: clients/android/app/build/outputs/apk/debug/
          if-no-files-found: error
