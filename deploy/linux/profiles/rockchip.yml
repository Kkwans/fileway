# Optional RK3588/Rockchip MPP profile; use a matching media runtime image.
# This is a hardware capability overlay, not another backend or Web UI.
services:
  filebrowser:
    environment:
      FB_HLS_ACCELERATOR: rkmpp
      FB_HLS_ENCODE_THREADS: "4"
    devices:
      - /dev/mpp_service:/dev/mpp_service
      - /dev/rga:/dev/rga
      - /dev/mali0:/dev/mali0
      - /dev/dma_heap/system:/dev/dma_heap/system
      - /dev/dma_heap/cma:/dev/dma_heap/cma
      - /dev/dri/card0:/dev/dri/card0
      - /dev/dri/renderD128:/dev/dri/renderD128
    security_opt: [systempaths=unconfined]
    volumes:
      - type: bind
        source: /sys/firmware/devicetree/base
        target: /sys/firmware/devicetree/base
        read_only: true
        bind: {create_host_path: false}
